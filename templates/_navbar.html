<header class="border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
        <div class="flex items-center space-x-3">
            <a href="/" class="flex items-center space-x-2.5 hover:opacity-90 transition-opacity">
                <span class="text-2xl">🐍</span>
                <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                    py-rm
                </span>
            </a>
            <span class="hidden sm:inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                Python Roadmap
            </span>
        </div>

        <div class="flex items-center space-x-3 sm:space-x-4">
            <div class="flex items-center space-x-2 text-sm text-slate-300">
                <span class="w-2 h-2 rounded-full {% if current_user.is_superuser %}bg-cyan-400{% else %}bg-emerald-500{% endif %} animate-pulse"></span>
                <span class="font-mono text-xs bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700/60">
                    {{ current_user.username }}
                </span>
                {% if current_user.is_superuser %}
                <span class="hidden sm:inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-300 border border-cyan-500/20">
                    Admin
                </span>
                {% endif %}
            </div>
            {% if current_user.is_superuser %}
            <a 
                href="/admin" 
                class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-cyan-500/30 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 transition-all flex items-center gap-1.5"
            >
                <span>⚡</span> <span class="hidden sm:inline">Admin Dashboard</span>
            </a>
            {% endif %}
            <form method="POST" action="/logout" class="inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button 
                    type="submit"
                    class="text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-700 hover:border-slate-600 bg-slate-800/50 hover:bg-slate-800 text-slate-300 hover:text-white transition-all cursor-pointer"
                >
                    Log Out
                </button>
            </form>
        </div>
    </div>
</header>
