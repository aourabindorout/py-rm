{% extends "base.html" %}

{% block title %}Too Many Requests - Python Roadmap{% endblock %}

{% block body %}
<div class="min-h-full flex-1 flex flex-col justify-center items-center px-4 py-12 relative overflow-hidden">
    <div class="w-full max-w-md text-center relative z-10">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-3xl mb-4 shadow-lg shadow-amber-500/5">
            🛡️
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white mb-2">Too Many Requests</h1>
        <p class="text-sm text-slate-400 leading-relaxed mb-6">
            For security, access to the login endpoint is strictly rate-limited. Please wait a minute and try again.
        </p>
        <a 
            href="/login" 
            class="inline-flex items-center justify-center py-2.5 px-5 rounded-xl bg-slate-800 hover:bg-slate-750 text-slate-200 border border-slate-700 text-sm font-semibold transition-all"
        >
            Reload Login Page
        </a>
    </div>
</div>
{% endblock %}
