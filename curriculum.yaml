    track: "intermediate"
    icon: "🏆"
    title: "Capstone Project: Build a Text RPG Adventure"
    duration: "40 min"
    summary: "Bring everything together! Combine classes, loops, conditionals, file saving, and random events into a complete playable dungeon adventure game."
    video:
      id: "bkPms92S9Qk"
      title: "Python Project: Text Adventure Game Walkthrough"
      author: "Tech With Tim"
      bonus_id: "9Os0o3wzS_I"
      bonus_title: "Bonus Architecture Review: Functions & Modular Design"
    concepts:
      - heading: "The Anatomy of a Game Loop"
        body: "Every game runs on a loop (while player.is_alive():). Each turn: display the world, ask the player for an action, update game state, and check win/loss conditions."
      - heading: "Combining All Your Skills"
        body: "Notice how the game below uses everything you've learned: Classes (Hero & Monster), lists (inventory), random (loot & damage), files (high score savings), and try/except (safe inputs)."
    code_example:
      title: "dungeon_rpg.py"
      code: |
        # Track 2 Capstone: Text Dungeon Adventure
        import random

        class Character:
            def __init__(self, name, health, attack):
                self.name = name
                self.health = health
                self.attack = attack

            def is_alive(self):
                return self.health > 0

        def battle(hero, monster):
            print(f"\n⚔️ A wild {monster.name} (HP: {monster.health}) appears!")
            while hero.is_alive() and monster.is_alive():
                dmg_to_monster = random.randint(hero.attack - 5, hero.attack + 5)
                monster.health -= dmg_to_monster
                print(f"You struck {monster.name} for {dmg_to_monster} damage!")

                if monster.is_alive():
                    dmg_to_hero = random.randint(monster.attack - 3, monster.attack + 3)
                    hero.health -= dmg_to_hero
                    print(f"{monster.name} hit you for {dmg_to_hero} damage! (Your HP: {hero.health})")

            return hero.is_alive()

        def main():
            hero = Character("Explorer", 100, 20)
            score = 0
            inventory = ["Wooden Sword", "Health Potion"]

            print("🏰 Welcome to the Dungeon of Python!")
            print(f"Hero: {hero.name} | HP: {hero.health} | Inventory: {inventory}")

            monsters = [
                Character("Goblin", 30, 8),
                Character("Skeleton Archer", 45, 12),
                Character("Cave Troll", 70, 16)
            ]

            for monster in monsters:
                if battle(hero, monster):
                    score += 100
                    print(f"🎉 Defeated {monster.name}! Current Score: {score}")
                else:
                    print(f"💀 You were defeated by {monster.name}...")
                    break
            else:
                print(f"\n👑 VICTORY! You cleared the entire dungeon with {score} points!")

        main()
