    summary: "Prevent your programs from crashing when bad input or unexpected errors happen by handling exceptions with try, except, and finally."
    video:
      id: "NIWwJbo-9_8"
      title: "Python Tutorial: Using Try/Except Blocks for Error Handling"
      author: "Corey Schafer"
    concepts:
      - heading: "What is an Exception?"
        body: "When code hits a problem (like dividing by zero, or converting 'abc' to an integer), Python raises an exception. If unhandled, the program crashes with a red traceback."
      - heading: "The Safety Net: try / except"
        body: "Put risky code inside a 'try:' block. If an error occurs, Python jumps to the 'except:' block without crashing, letting you handle the error gracefully."
    code_example:
      title: "safe_input.py"
      code: |
        # Safely handling user input without crashing

        def get_positive_number(prompt):
            while True:
                user_input = input(prompt)
                try:
                    num = float(user_input)
                    if num <= 0:
                        print("Please enter a number greater than 0!")
                        continue
                    return num
                except ValueError:
                    print(f"'{user_input}' is not a valid number! Try again.")

        # Test safe division
        print("Welcome to the Safe Divider!")
        numerator = get_positive_number("Enter numerator: ")
        denominator = get_positive_number("Enter denominator: ")

        try:
            result = numerator / denominator
            print(f"Result: {numerator} / {denominator} = {result:.2f}")
        except ZeroDivisionError:
            print("Cannot divide by zero!")
        finally:
            print("Calculation complete.")
