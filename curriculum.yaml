      title: "rpg_hero.py"
      code: |
        # Object-Oriented Programming in Python

        class Hero:
            def __init__(self, name, hero_class, health, attack_power):
                self.name = name
                self.hero_class = hero_class
                self.health = health
                self.attack_power = attack_power

            def take_damage(self, amount):
                self.health = max(0, self.health - amount)
                print(f"💥 {self.name} took {amount} damage! Health remaining: {self.health}")

            def attack(self, target):
                print(f"⚔️ {self.name} strikes {target.name} for {self.attack_power} damage!")
                target.take_damage(self.attack_power)

            def is_alive(self):
                return self.health > 0

        # Create two hero instances
        warrior = Hero("Ragnar", "Warrior", 100, 25)
        wizard = Hero("Gandalf", "Wizard", 70, 35)

        print(f"Created: {warrior.name} ({warrior.hero_class}) - HP: {warrior.health}")
        print(f"Created: {wizard.name} ({wizard.hero_class}) - HP: {wizard.health}")

        # Simulate a quick battle round
        warrior.attack(wizard)
        wizard.attack(warrior)
